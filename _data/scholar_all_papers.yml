- title: The Role of Science in the Climate Change Discussions on Reddit
  author: Cornale, Paolo; Tizzani, Michele; Ciulla, Fabio; Kalimeri, Kyriaki; Omodei,
    Elisa; Paolotti, Daniela; Mejova, Yelena
  journal: PLOS Climate
  year: "2025"
  volume: "4"
  pages: e0000541
  url: https://doi.org/10.1371/journal.pclm.0000541
  doi: 10.1371/journal.pclm.0000541
  abstract: Well-informed collective and individual action necessary to address climate
    change hinges on the public's understanding of the relevant scientific findings.
    Social media has been a popular platform for the deliberation around climate change
    and the policies aimed at addressing it. Whether such deliberation is informed
    by scientific findings is an important step in gauging the public's awareness
    of scientific resources and their latest findings. In this study, we examine the
    use of scientific sources in the course of 14 years of public deliberation around
    climate change on one of the largest social media platforms, Reddit. We find that
    only 4.0\% of the links in the Reddit posts, and 6.5\% in the comments, point
    to domains of scientific sources, although these rates have been increasing in
    the past decades. These links are dwarfed, however, by the citations of mass media,
    newspapers, and social media, the latter of which peaked especially during 2019--2020.
    Further, scientific sources are more likely to be posted by users who also post
    links to sources having central-left political leaning, and less so by those posting
    more polarized sources. Scientific sources are not often used in response to links
    to unreliable sources, instead, other such sources are likely to appear in their
    comments. This study provides the quantitative evidence of the dearth of scientific
    basis of the online public debate and puts it in the context of other, potentially
    unreliable, sources of information.
  bibkey: cornaleRoleScienceClimate2025
- title: "Echoes through Time: Evolution of the Italian COVID-19 Vaccination Debate"
  author: Crupi, Giuseppe; Mejova, Yelena; Tizzani, Michele; Paolotti, Daniela; Panisson,
    Andr{\'e}
  journal: Proceedings of the International AAAI Conference on Web and Social Media
  year: "2022"
  volume: "16"
  pages: 102--113
  url: https://doi.org/10.1609/icwsm.v16i1.19276
  doi: 10.1609/icwsm.v16i1.19276
  abstract: Italy was the first European country to be hit by COVID-19 in the early
    2020, since then losing over 100,000 people to the disease. By the end of the
    vaccination campaign of 2021, 81\% of the public received at least one dose. These
    dramatic developments were accompanied by a rigorous discussion around vaccination,
    both about its urgency and its possible negative effects. Twitter is one of the
    most popular social media platforms in the country, but pre-pandemic vaccination
    debate has been shown to be polarized and siloed into echo chambers. It is thus
    imperative to understand the nature of this discourse, with a specific focus on
    the vaccination hesitant individuals, whose healthcare decisions may affect their
    communities and the country at large. In this study we ask, how has the Italian
    discussion around vaccination changed during the COVID-19 pandemic, and have the
    unprecedented events of 2020-2021 been able to break the echo chamber around this
    topic? We use a Twitter dataset spanning September 2019 - November 2021 to examine
    the state of polarization around vaccination. We propose a hierarchical clustering
    approach to find the largest communities in the endorsement networks of different
    time periods, and manually illustrate that it produces communities of users sharing
    a stance. Examining the structure of these networks, as well as textual content
    of their interactions, we find the stark division between supporters and hesitant
    individuals to continue throughout the vaccination campaign. However, we find
    an increasing commonality in the topical focus of the vaccine supporters and vaccine
    hesitant, pointing to a possible common set of facts the two sides may agree on.
    Still, we discover a series of concerns voiced by the hesitant community, ranging
    from unfounded conspiracies (microchips in vaccines) to public health policy discussion
    (vaccine passport limitations). We recommend an ongoing surveillance of this debate,
    especially to uncover concerns around vaccination before the public health decisions
    and official messaging are made public.
  bibkey: crupiEchoesTimeEvolution2022
- title: Phase Transitions and Stability of Dynamical Processes on Hypergraphs
  author: Arruda, Guilherme; Tizzani, Michele; Moreno, Yamir
  journal: Communications Physics
  year: "2021"
  volume: "4"
  pages: 1--9
  url: https://doi.org/10.1038/s42005-021-00525-3
  doi: 10.1038/s42005-021-00525-3
  abstract: Hypergraphs naturally represent higher-order interactions, which persistently
    appear in social interactions, neural networks, and other natural systems. Although
    their importance is well recognized, a theoretical framework to describe general
    dynamical processes on hypergraphs is not available yet. In this paper, we derive
    expressions for the stability of dynamical systems defined on an arbitrary hypergraph.
    The framework allows us to reveal that, near the fixed point, the relevant structure
    is a weighted graph-projection of the hypergraph and that it is possible to identify
    the role of each structural order for a given process. We analytically solve two
    dynamics of general interest, namely, social contagion and diffusion processes,
    and show that the stability conditions can be decoupled in structural and dynamical
    components. Our results show that in social contagion process, only pairwise interactions
    play a role in the stability of the absorbing state, while for the diffusion dynamics,
    the order of the interactions plays a differential role. Our work provides a general
    framework for further exploration of dynamical processes on hypergraphs.
  bibkey: ferrazdearrudaPhaseTransitionsStability2021
- title: Impact of Food-Related Conflicts on Self-Reported Food Insecurity
  author: Fiandrino, Stefania; Dowd, Caitriona; Martini, Giulia; Mejova, Yelena; Omodei,
    Elisa; Paolotti, Daniela; Tizzani, Michele
  journal: Frontiers in Sustainable Food Systems
  year: "2023"
  volume: "7"
  pages: ""
  url: null
  doi: ""
  abstract: "Food security is recognized as an inherent human right, enshrined within
    the principles of the Agenda 2030. The Global Report of Food Crises 2022 points
    out 193 million people facing severe food insecurity across 53 countries, posing
    challenges to decision-makers and institutions. Among the many causes of food
    crises, violent conflict, economic shocks, and environmental pressures are the
    most influential. In this work, we focus primarily on the conflict-related domain.
    Finding a stable relationship between conflict and food insecurity is complex
    for several reasons: first, the relationship is mutually reinforcing; second,
    the full impact of conflict on food insecurity may take time to have an effect;
    and third, conflict itself is a multidimensional phenomenon and can include multiple
    types of violent events. This research set out to comparatively assess the impact
    of different types of violence on self-reported food insecurity in three prominent
    food crisis contexts: Burkina Faso, Syria, and Yemen. A measure of food-related
    classifying events was developed using a rules-based approach. The analysis showed
    that this approach can effectively code and classify food-related conflict in
    diverse contexts. By refining the search string, it becomes possible to capture
    food-related conflict in various food systems. Our findings point out that the
    new-build measure of food-related conflict is more strongly correlated to subsequent
    self-reported insufficient food consumption than other forms of violence. The
    results demonstrate that this relationship is robust across a range of data collection
    windows and across discrete time periods of analysis. In summary, the research
    suggests that focusing on the use of food and food systems as tactics in conflict
    can be highly valuable for understanding and addressing food insecurity."
  bibkey: fiandrinoImpactFoodrelatedConflicts2023
- title: "Collective Response to Media Coverage of the COVID-19 Pandemic on Reddit
    and Wikipedia: Mixed-Methods Analysis"
  author: Gozzi, N.; Tizzani, M.; Starnini, M.; Ciulla, F.; Paolotti, D.; Panisson,
    A.; Perra, N.
  journal: Journal of medical Internet research
  year: "2020"
  volume: "22"
  pages: ""
  url: https://doi.org/10.2196/21597
  doi: 10.2196/21597
  abstract: '\copyright Nicol\`o Gozzi, Michele Tizzani, Michele Starnini, Fabio Ciulla,
    Daniela Paolotti, Andr\''e Panisson, Nicola Perra. Originally published in the
    Journal of Medical Internet Research (http://www.jmir.org), 12.10.2020. BACKGROUND:
    The exposure and consumption of information during epidemic outbreaks may alter
    people''s risk perception and trigger behavioral changes, which can ultimately
    affect the evolution of the disease. It is thus of utmost importance to map the
    dissemination of information by mainstream media outlets and the public response
    to this information. However, our understanding of this exposure-response dynamic
    during the COVID-19 pandemic is still limited. OBJECTIVE: The goal of this study
    is to characterize the media coverage and collective internet response to the
    COVID-19 pandemic in four countries: Italy, the United Kingdom, the United States,
    and Canada. METHODS: We collected a heterogeneous data set including 227,768 web-based
    news articles and 13,448 YouTube videos published by mainstream media outlets,
    107,898 user posts and 3,829,309 comments on the social media platform Reddit,
    and 278,456,892 views of COVID-19-related Wikipedia pages. To analyze the relationship
    between media coverage, epidemic progression, and users'' collective web-based
    response, we considered a linear regression model that predicts the public response
    for each country given the amount of news exposure. We also applied topic modelling
    to the data set using nonnegative matrix factorization. RESULTS: Our results show
    that public attention, quantified as user activity on Reddit and active searches
    on Wikipedia pages, is mainly driven by media coverage; meanwhile, this activity
    declines rapidly while news exposure and COVID-19 incidence remain high. Furthermore,
    using an unsupervised, dynamic topic modeling approach, we show that while the
    levels of attention dedicated to different topics by media outlets and internet
    users are in good accordance, interesting deviations emerge in their temporal
    patterns. CONCLUSIONS: Overall, our findings offer an additional key to interpret
    public perception and response to the current global health emergency and raise
    questions about the effects of attention saturation on people''s collective awareness
    and risk perception and thus on their tendencies toward behavioral change.'
  bibkey: gozziCollectiveResponseMedia2020
- title: "Global Misinformation Spillovers in the Vaccination Debate Before and During
    the COVID-19 Pandemic: Multilingual Twitter Study"
  author: Lenti, Jacopo; Mejova, Yelena; Kalimeri, Kyriaki; Panisson, Andr{\'e}; Paolotti,
    Daniela; Tizzani, Michele; Starnini, Michele
  journal: JMIR Infodemiology
  year: "2023"
  volume: "3"
  pages: e44714
  url: https://doi.org/10.2196/44714
  doi: 10.2196/44714
  abstract: "Background: Antivaccination views pervade online social media, fueling
    distrust in scientific expertise and increasing the number of vaccine-hesitant
    individuals. Although previous studies focused on specific countries, the COVID-19
    pandemic has brought the vaccination discourse worldwide, underpinning the need
    to tackle low-credible information flows on a global scale to design effective
    countermeasures. Objective: This study aimed to quantify cross-border misinformation
    flows among users exposed to antivaccination (no-vax) content and the effects
    of content moderation on vaccine-related misinformation. Methods: We collected
    316 million vaccine-related Twitter (Twitter, Inc) messages in 18 languages from
    October 2019 to March 2021. We geolocated users in 28 different countries and
    reconstructed a retweet network and cosharing network for each country. We identified
    communities of users exposed to no-vax content by detecting communities in the
    retweet network via hierarchical clustering and manual annotation. We collected
    a list of low-credibility domains and quantified the interactions and misinformation
    flows among no-vax communities of different countries. Results: The findings showed
    that during the pandemic, no-vax communities became more central in the country-specific
    debates and their cross-border connections strengthened, revealing a global Twitter
    antivaccination network. US users are central in this network, whereas Russian
    users also became net exporters of misinformation during vaccination rollout.
    Interestingly, we found that Twitter's content moderation efforts, in particular
    the suspension of users following the January 6 US Capitol attack, had a worldwide
    impact in reducing the spread of misinformation about vaccines. Conclusions: These
    findings may help public health institutions and social media platforms mitigate
    the spread of health-related, low-credibility information by revealing vulnerable
    web-based communities."
  bibkey: lentiGlobalMisinformationSpillovers2023
- title: "Vaccine Hesitancy on YouTube: A Competition Between Health and Politics"
  author: Mejova, Yelena; Tizzani, Michele
  journal: ""
  year: "2025"
  volume: ""
  pages: 1--8
  url: https://doi.org/10.1109/DPH66411.2025.11198076
  doi: 10.1109/DPH66411.2025.11198076
  abstract: YouTube has rapidly emerged as a predominant platform for content consumption,
    effectively displacing conventional media such as television and news outlets.
    A part of the enormous video stream uploaded to this platform includes healthrelated
    content, both from official public health organizations, and from any individual
    or group that can make an account. The quality of information available on YouTube
    is a critical point of public health safety, especially when concerning major
    interventions, such as vaccination. This study differentiates itself from previous
    efforts of auditing YouTube videos on this topic by conducting a systematic daily
    collection of posted videos mentioning vaccination for the duration of 3 months.
    We show that the competition for the public's attention is between public health
    messaging by institutions and individual educators on one side, and commentators
    on society and politics on the other, the latest contributing the most to the
    videos expressing stances against vaccination. Videos opposing vaccination are
    more likely to mention politicians and publication media such as podcasts, reports,
    and news analysis, on the other hand, videos in favor are more likely to mention
    specific diseases or healthrelated topics. Finally, we find that, at the time
    of analysis, only \textbackslash mathbf2. 7 \% of the videos have been taken down
    (by the platform or the channel), despite 20.8 \% of the collected videos having
    a vaccination hesitant stance, pointing to a lack of moderation activity for hesitant
    content. The availability of high-quality information is essential to improve
    awareness and compliance with public health interventions. Our findings help characterize
    the public discourse around vaccination on one of the largest media platforms,
    disentangling the role of the different creators and their stances, and as such,
    they provide important insights for public health communication policy.
  bibkey: mejovaVaccineHesitancyYouTube2025
- title: Political Context of the European Vaccine Debate on Twitter
  author: Paoletti, Giordano; Dall'Amico, Lorenzo; Kalimeri, Kyriaki; Lenti, Jacopo;
    Mejova, Yelena; Paolotti, Daniela; Starnini, Michele; Tizzani, Michele
  journal: Scientific Reports
  year: "2024"
  volume: "14"
  pages: "4397"
  url: https://doi.org/10.1038/s41598-024-54863-7
  doi: 10.1038/s41598-024-54863-7
  abstract: At the beginning of the COVID-19 pandemic, fears grew that making vaccination
    a political (instead of public health) issue may impact the efficacy of this life-saving
    intervention, spurring the spread of vaccine-hesitant content. In this study,
    we examine whether there is a relationship between the political interest of social
    media users and their exposure to vaccine-hesitant content on Twitter. We focus
    on 17 European countries using a multilingual, longitudinal dataset of tweets
    spanning the period before COVID, up to the vaccine roll-out. We find that, in
    most countries, users' endorsement of vaccine-hesitant content is the highest
    in the early months of the pandemic, around the time of greatest scientific uncertainty.
    Further, users who follow politicians from right-wing parties, and those associated
    with authoritarian or anti-EU stances are more likely to endorse vaccine-hesitant
    content, whereas those following left-wing politicians, more pro-EU or liberal
    parties, are less likely. Somewhat surprisingly, politicians did not play an outsized
    role in the vaccine debates of their countries, receiving a similar number of
    retweets as other similarly popular users. This systematic, multi-country, longitudinal
    investigation of the connection of politics with vaccine hesitancy has important
    implications for public health policy and communication.
  bibkey: paolettiPoliticalContextEuropean2024a
- title: Epidemic Spreading and Aging in Temporal Networks with Memory
  author: Tizzani, M.; Lenti, S.; Ubaldi, E.; Vezzani, A.; Castellano, C.; Burioni,
    R.
  journal: Physical Review E
  year: "2018"
  volume: "98"
  pages: ""
  url: https://doi.org/10.1103/PhysRevE.98.062315
  doi: 10.1103/PhysRevE.98.062315
  abstract: \copyright{} 2018 American Physical Society. Time-varying network topologies
    can deeply influence dynamical processes mediated by them. Memory effects in the
    pattern of interactions among individuals are also known to affect how diffusive
    and spreading phenomena take place. In this paper we analyze the combined effect
    of these two ingredients on epidemic dynamics on networks. We study the susceptible-infected-susceptible
    (SIS) and the susceptible-infected-recovered (SIR) models on the recently introduced
    activity-driven networks with memory. By means of an activity-based mean-field
    approach, we derive, in the long-time limit, analytical predictions for the epidemic
    threshold as a function of the parameters describing the distribution of activities
    and the strength of the memory effects. Our results show that memory reduces the
    threshold, which is the same for SIS and SIR dynamics, therefore favoring epidemic
    spreading. The theoretical approach perfectly agrees with numerical simulations
    in the long-time asymptotic regime. Strong aging effects are present in the preasymptotic
    regime and the epidemic threshold is deeply affected by the starting time of the
    epidemics. We discuss in detail the origin of the model-dependent preasymptotic
    corrections, whose understanding could potentially allow for epidemic control
    on correlated temporal networks.
  bibkey: tizzaniEpidemicSpreadingAging2018
- title: Impact of Tiered Measures on Social Contact and Mixing Patterns of in Italy
    during the Second Wave of COVID-19
  author: Tizzani, Michele; De Gaetano, Alessandro; Jarvis, Christopher; Gimma, Amy;
    Wong, Kerry; Edmunds, W.; Beutels, Philippe; Hens, Niel; Coletti, Pietro; Paolotti,
    Daniela
  journal: BMC Public Health
  year: "2023"
  volume: "23"
  pages: "906"
  url: https://doi.org/10.1186/s12889-023-15846-x
  doi: 10.1186/s12889-023-15846-x
  abstract: Most countries around the world enforced non-pharmaceutical interventions
    against COVID-19. Italy was one of the first countries to be affected by the pandemic,
    imposing a hard lockdown, in the first epidemic wave. During the second wave,
    the country implemented progressively restrictive tiers at the regional level
    according to weekly epidemiological risk assessments. This paper quantifies the
    impact of these restrictions on contacts and on the reproduction number.
  bibkey: tizzaniImpactTieredMeasures2023
- title: "Integrating Digital and Field Surveillance as Complementary Efforts to Manage
    Epidemic Diseases of Livestock: African Swine Fever as a Case Study"
  author: Tizzani, Michele; {Mu{\~n}oz-G{\'o}mez}, Violeta; Nardi, Marco; Paolotti,
    Daniela; Mu{\~n}oz, Olga; Ceschi, Piera; Viltrop, Arvo; Capua, Ilaria
  journal: PLOS ONE
  year: "2021"
  volume: "16"
  pages: e0252972
  url: https://doi.org/10.1371/journal.pone.0252972
  doi: 10.1371/journal.pone.0252972
  abstract: SARS-CoV-2 has clearly shown that efficient management of infectious diseases
    requires a top-down approach which must be complemented with a bottom-up response
    to be effective. Here we investigate a novel approach to surveillance for transboundary
    animal diseases using African Swine (ASF) fever as a model. We collected data
    both at a population level and at the local level on information-seeking behavior
    respectively through digital data and targeted questionnaire-based surveys to
    relevant stakeholders such as pig farmers and veterinary authorities. Our study
    shows how information-seeking behavior and resulting public attention during an
    epidemic, can be identified through novel data streams from digital platforms
    such as Wikipedia. Leveraging attention in a critical moment can be key to providing
    the correct information at the right moment, especially to an interested cohort
    of people. We also bring evidence on how field surveys aimed at local workers
    and veterinary authorities remain a crucial tool to assess more in-depth preparedness
    and awareness among front-line actors. We conclude that these two tools should
    be used in combination to maximize the outcome of surveillance and prevention
    activities for selected transboundary animal diseases such as ASF.
  bibkey: tizzaniIntegratingDigitalField2021
- title: "Socioeconomic Determinants of Protective Behaviors and Contact Patterns
    in the Post-COVID-19 Pandemic Era: A Cross-Sectional Study in Italy"
  author: Tizzani, Michele; Gauvin, Laetitia
  journal: PLOS Computational Biology
  year: "2025"
  volume: "21"
  pages: e1013262
  url: https://doi.org/10.1371/journal.pcbi.1013262
  doi: 10.1371/journal.pcbi.1013262
  abstract: Socioeconomic inequalities significantly influence infectious disease
    outcomes, as seen with COVID-19, but the pathways through which socioeconomic
    conditions affect transmission dynamics remain unclear. To address this, we conducted
    a survey representative of the Italian population, stratified by age, gender,
    geographical area, city size, employment status, and education level. The survey's
    final aim was to estimate differences in contact and protective behaviors across
    various population strata, both of which are crucial for understanding transmission
    dynamics. Our initial insights based on the survey indicate that years after the
    pandemic began, the perceived impact of COVID-19 on professional, economic, social,
    and psychological dimensions vary across socioeconomic strata, extending beyond
    the epidemiological outcomes. This reinforces the need for approaches that systematically
    consider socioeconomic determinants. In this context, using generalized linear
    models, we identified associations between socioeconomic factors and vaccination
    status for both COVID-19 and influenza, as well as the influence of socioeconomic
    conditions on mask-wearing and social distancing. Importantly, we also observed
    differences in contact behaviors based on employment status while education level
    did not show a significant association. These findings highlight the complex interplay
    of socioeconomic and demographic factors in shaping protective behavior and contact
    patterns. Understanding these dynamics can contribute to the improvement of epidemic
    models and better guide public health efforts for at-risk groups.
  bibkey: tizzaniSocioeconomicDeterminantsProtective2025a
