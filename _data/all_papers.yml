- title: "Echoes through time: evolution of the Italian COVID-19 vaccination debate"
  author: Crupi, G.; Mejova, Y.; Tizzani, M.; Paolotti, D.; Panisson, A.
  journal: Proceedings of the International AAAI Conference on Web and Social Media (ICWSM)
  year: "2022"
  volume: "16"
  pages: 102--113
  url: https://doi.org/10.1609/icwsm.v16i1.19276
  doi: 10.1609/icwsm.v16i1.19276
  abstract: Italy was the first European country to be hit by COVID-19 in the early 2020, since then losing
    over 100,000 people to the disease. By the end of the vaccination campaign of 2021, 81% of the public
    received at least one dose. These dramatic developments were accompanied by a rigorous discussion
    around vaccination, both about its urgency and its possible negative effects. Twitter is one of the
    most popular social media platforms in the country, but pre-pandemic vaccination debate has been shown
    to be polarized and siloed into echo chambers. It is thus imperative to understand the nature of this
    discourse, with a specific focus on the vaccination hesitant individuals, whose healthcare decisions
    may affect their communities and the country at large. In this study we ask, how has the Italian discussion
    around vaccination changed during the COVID-19 pandemic, and have the unprecedented events of 2020-2021
    been able to break the echo chamber around this topic? We use a Twitter dataset spanning September
    2019 - November 2021 to examine the state of polarization around vaccination. We propose a hierarchical
    clustering approach to find the largest communities in the endorsement networks of different time
    periods, and manually illustrate that it produces communities of users sharing a stance. Examining
    the structure of these networks, as well as textual content of their interactions, we find the stark
    division between supporters and hesitant individuals to continue throughout the vaccination campaign.
    However, we find an increasing commonality in the topical focus of the vaccine supporters and vaccine
    hesitant, pointing to a possible common set of facts the two sides may agree on. Still, we discover
    a series of concerns voiced by the hesitant community, ranging from unfounded conspiracies (microchips
    in vaccines) to public health policy discussion (vaccine passport limitations). We recommend an ongoing
    surveillance of this debate, especially to uncover concerns around vaccination before the public health
    decisions and official messaging are made public.
- title: Phase transitions and stability of dynamical processes on hypergraphs
  author: Ferraz de Arruda, G.; Tizzani, M.; Moreno, Y.
  journal: Communications Physics
  year: "2021"
  volume: "4"
  pages: "24"
  url: https://doi.org/10.1038/s42005-021-00525-3
  doi: 10.1038/s42005-021-00525-3
  abstract: Hypergraphs naturally represent higher-order interactions, which persistently appear in social
    interactions, neural networks, and other natural systems. Although their importance is well recognized,
    a theoretical framework to describe general dynamical processes on hypergraphs is not available yet.
    In this paper, we derive expressions for the stability of dynamical systems defined on an arbitrary
    hypergraph. The framework allows us to reveal that, near the fixed point, the relevant structure is
    a weighted graph-projection of the hypergraph and that it is possible to identify the role of each
    structural order for a given process. We analytically solve two dynamics of general interest, namely,
    social contagion and diffusion processes, and show that the stability conditions can be decoupled
    in structural and dynamical components. Our results show that in social contagion process, only pairwise
    interactions play a role in the stability of the absorbing state, while for the diffusion dynamics,
    the order of the interactions plays a differential role. Our work provides a general framework for
    further exploration of dynamical processes on hypergraphs.
- title: "Integrating digital and field surveillance as complementary efforts to manage epidemic diseases
    of livestock: African swine fever as a case study"
  author: Tizzani, M.; Muñoz-Gómez, V.; De Nardi, M.; Paolotti, D.; Muñoz, O.; Ceschi, P.; Viltrop, A.;
    Capua, I.
  journal: PLOS ONE
  year: "2021"
  volume: "16"
  pages: e0252972
  url: https://doi.org/10.1371/journal.pone.0252972
  doi: 10.1371/journal.pone.0252972
  abstract: SARS-CoV-2 has clearly shown that efficient management of infectious diseases requires a top-down
    approach which must be complemented with a bottom-up response to be effective. Here we investigate
    a novel approach to surveillance for transboundary animal diseases using African Swine (ASF) fever
    as a model. We collected data both at a population level and at the local level on information-seeking
    behavior respectively through digital data and targeted questionnaire-based surveys to relevant stakeholders
    such as pig farmers and veterinary authorities. Our study shows how information-seeking behavior and
    resulting public attention during an epidemic, can be identified through novel data streams from digital
    platforms such as Wikipedia. Leveraging attention in a critical moment can be key to providing the
    correct information at the right moment, especially to an interested cohort of people. We also bring
    evidence on how field surveys aimed at local workers and veterinary authorities remain a crucial tool
    to assess more in-depth preparedness and awareness among front-line actors. We conclude that these
    two tools should be used in combination to maximize the outcome of surveillance and prevention activities
    for selected transboundary animal diseases such as ASF.
- title: "Collective response to media coverage of the COVID-19 pandemic on Reddit and Wikipedia: mixed-methods
    analysis"
  author: Gozzi, N.; Tizzani, M.; Starnini, M.; Ciulla, F.; Paolotti, D.; Panisson, A.; Perra, N.
  journal: Journal of Medical Internet Research
  year: "2020"
  volume: "22"
  pages: e21597
  url: https://doi.org/10.2196/21597
  doi: 10.2196/21597
  abstract: "BACKGROUND: The exposure and consumption of information during epidemic outbreaks may alter
    people's risk perception and trigger behavioral changes, which can ultimately affect the evolution
    of the disease. It is thus of utmost importance to map the dissemination of information by mainstream
    media outlets and the public response to this information. However, our understanding of this exposure-response
    dynamic during the COVID-19 pandemic is still limited. OBJECTIVE: The goal of this study is to characterize
    the media coverage and collective internet response to the COVID-19 pandemic in four countries: Italy,
    the United Kingdom, the United States, and Canada. METHODS: We collected a heterogeneous data set
    including 227,768 web-based news articles and 13,448 YouTube videos published by mainstream media
    outlets, 107,898 user posts and 3,829,309 comments on the social media platform Reddit, and 278,456,892
    views of COVID-19-related Wikipedia pages. To analyze the relationship between media coverage, epidemic
    progression, and users' collective web-based response, we considered a linear regression model that
    predicts the public response for each country given the amount of news exposure. We also applied topic
    modelling to the data set using nonnegative matrix factorization. RESULTS: Our results show that public
    attention, quantified as user activity on Reddit and active searches on Wikipedia pages, is mainly
    driven by media coverage; meanwhile, this activity declines rapidly while news exposure and COVID-19
    incidence remain high. Furthermore, using an unsupervised, dynamic topic modeling approach, we show
    that while the levels of attention dedicated to different topics by media outlets and internet users
    are in good accordance, interesting deviations emerge in their temporal patterns. CONCLUSIONS: Overall,
    our findings offer an additional key to interpret public perception and response to the current global
    health emergency and raise questions about the effects of attention saturation on people's collective
    awareness and risk perception and thus on their tendencies toward behavioral change."
- title: Epidemic spreading and aging in temporal networks with memory
  author: Tizzani, M.; Lenti, S.; Ubaldi, E.; Vezzani, A.; Castellano, C.; Burioni, R.
  journal: Physical Review E
  year: "2018"
  volume: "98"
  pages: "062315"
  url: https://doi.org/10.1103/PhysRevE.98.062315
  doi: 10.1103/PhysRevE.98.062315
  abstract: Time-varying network topologies can deeply influence dynamical processes mediated by them.
    Memory effects in the pattern of interactions among individuals are also known to affect how diffusive
    and spreading phenomena take place. In this paper we analyze the combined effect of these two ingredients
    on epidemic dynamics on networks. We study the susceptible-infected-susceptible (SIS) and the susceptible-infected-recovered
    (SIR) models on the recently introduced activity-driven networks with memory. By means of an activity-based
    mean-field approach, we derive, in the long-time limit, analytical predictions for the epidemic threshold
    as a function of the parameters describing the distribution of activities and the strength of the
    memory effects. Our results show that memory reduces the threshold, which is the same for SIS and
    SIR dynamics, therefore favoring epidemic spreading. The theoretical approach perfectly agrees with
    numerical simulations in the long-time asymptotic regime. Strong aging effects are present in the
    preasymptotic regime and the epidemic threshold is deeply affected by the starting time of the epidemics.
    We discuss in detail the origin of the model-dependent preasymptotic corrections, whose understanding
    could potentially allow for epidemic control on correlated temporal networks.
