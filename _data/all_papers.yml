- title: Impact of tiered measures on social contact and mixing patterns in Italy during the second wave
    of COVID-19
  author: Tizzani, M.; De Gaetano, A.; Jarvis, C. I.; Gimma, A.; Wong, K.; Edmunds, W. J.; Beutels, P.;
    Hens, N.; Coletti, P.; Paolotti, D.
  journal: BMC Public Health
  year: "2023"
  volume: "23"
  pages: "906"
  url: https://doi.org/10.1186/s12889-023-15846-x
  doi: 10.1186/s12889-023-15846-x
  abstract: Most countries around the world enforced non-pharmaceutical interventions against COVID-19.
    Italy was one of the first countries to be affected by the pandemic, imposing a hard lockdown, in
    the first epidemic wave. During the second wave, the country implemented progressively restrictive
    tiers at the regional level according to weekly epidemiological risk assessments. This paper quantifies
    the impact of these restrictions on contacts and on the reproduction number.
- title: Impact of food-related conflicts on self-reported food insecurity
  author: Fiandrino, S.; Dowd, C.; Martini, G.; Mejova, Y.; Omodei, E.; Paolotti, D.; Tizzani, M.
  journal: Frontiers in Sustainable Food Systems
  year: "2023"
  volume: "7"
  pages: "1239992"
  url: https://doi.org/10.3389/fsufs.2023.1239992
  doi: 10.3389/fsufs.2023.1239992
  abstract: "Food security is recognized as an inherent human right, enshrined within the principles of
    the Agenda 2030. The Global Report of Food Crises 2022 points out 193 million people facing severe
    food insecurity across 53 countries, posing challenges to decision-makers and institutions. Among
    the many causes of food crises, violent conflict, economic shocks, and environmental pressures are
    the most influential. In this work, we focus primarily on the conflict-related domain. Finding a stable
    relationship between conflict and food insecurity is complex for several reasons: first, the relationship
    is mutually reinforcing; second, the full impact of conflict on food insecurity may take time to have
    an effect; and third, conflict itself is a multidimensional phenomenon and can include multiple types
    of violent events. This research set out to comparatively assess the impact of different types of
    violence on self-reported food insecurity in three prominent food crisis contexts: Burkina Faso, Syria,
    and Yemen. A measure of food-related classifying events was developed using a rules-based approach.
    The analysis showed that this approach can effectively code and classify food-related conflict in
    diverse contexts. By refining the search string, it becomes possible to capture food-related conflict
    in various food systems. Our findings point out that the new-build measure of food-related conflict
    is more strongly correlated to subsequent self-reported insufficient food consumption than other forms
    of violence. The results demonstrate that this relationship is robust across a range of data collection
    windows and across discrete time periods of analysis. In summary, the research suggests that focusing
    on the use of food and food systems as tactics in conflict can be highly valuable for understanding
    and addressing food insecurity."
