- title: "Engagement trends in online vaccine content: a longitudinal YouTube study"
  author: Tizzani, M.; Mejova, Y.
  journal: Journal of Medical Internet Research
  year: "2026"
  volume: "28"
  pages: e88519
  url: https://doi.org/10.2196/88519
  doi: 10.2196/88519
  abstract: "Background: YouTube is the primary global video platform, hosting both authoritative health
    information and vaccine-skeptic viewpoints. However, engagement dynamics remain poorly understood.
    Objective: The aim of this study was to investigate the temporal and textual dynamics of engagement
    of the YouTube viewership with vaccination content, and specifically content that is in favor of or
    against vaccination. We contextualized these dynamics in the authority signals of the posting channel
    and the moderation actions taken by the platform. Methods: We conducted a 6-month daily longitudinal
    analysis of 7213 vaccine-related YouTube videos (November 2024 to May 2025) mentioning vaccination.
    We used zero-shot large language model classification with manual verification to classify the video
    stance toward vaccination, and the stance of their comments toward the video. The engagement and disagreement
    dynamics were modeled using Bayesian regression. Results: Our findings show engagement asymmetry between
    content supporting and questioning vaccination. Vaccine-hesitant videos in our sample receive substantially
    higher raw engagement and moderate normalized engagement rates (a 2.5-2.6x difference versus strongly
    pro-vaccine videos). Vaccine-hesitant videos reach 90% of cumulative views faster (18 vs 32 days;
    44% faster), while models adjusting for total engagement volume indicate that approximately 20% of
    this advantage reflects genuine temporal compression independent of engagement volume. Comment analysis
    indicated that the vaccine-hesitant videos foster echo chambers, while the pro-vaccine content attracts
    battlegrounds. Pro-vaccine content tends to originate from organizations, particularly news and health
    institutions, while vaccine-hesitant discourse is more likely to come from individual creators, even
    those self-identifying as medical doctors. Moderation, on the rare occasion when it occurs (about
    2% of the videos were taken down), comes after engagement saturation, limiting its effectiveness.
    Conclusions: Our analysis suggests that vaccine-hesitant content can dominate YouTube's engagement
    ecosystem through rapid early-stage amplification, which has direct implications for public health
    intervention timing and platform governance policy."
- title: "Taking the pulse of reform: what can a multi-channel analysis of media and parliamentary speeches
    tell us about public acceptability?"
  author: Parazzoli, S. M.; Tizzani, M.; Quaggiotto, M.; Murtin, F.; Martin, N.; Gozzi, N.; Gauvin, L.
  journal: Data & Policy
  year: "2026"
  volume: "8"
  pages: e29
  url: https://doi.org/10.1017/dap.2026.10077
  doi: 10.1017/dap.2026.10077
  abstract: Gauging the extent of public acceptability of reforms is an important concern for policymakers.
    Timely insights into public perceptions can illuminate how reforms are received and how attitudes
    evolve over time. In this study, we build on the OECD's Public Acceptability Tool, a framework encompassing
    four key dimensions of reform acceptability—Economic, Fairness, Behavioural, and Process—to evaluate
    the public acceptability of policy reforms. We take the 2023 French pension reform as a relevant case
    study, using online media articles and parliamentary speeches as indicators of discourse surrounding
    the reform. Using word embeddings, we classify these texts according to the four dimensions and apply
    matrix factorisation topic algorithms to uncover the latent themes within each. Our analysis shows
    that the Process dimension dominated media coverage during the discussion and legislative phases of
    the reform, consistent with previous literature on pension reforms. In contrast, no particular dimension
    was predominant in parliamentary speeches, suggesting a mismatch between policy and public debates.
    Finally, we identify the main topics driving public discussion within each dimension, highlighting
    notable differences between media narratives and parliamentary discourse that offer further insight
    into the dynamics of public acceptability.
- title: "Socioeconomic determinants of protective behaviors and contact patterns in the post-COVID-19
    pandemic era: a cross-sectional study in Italy"
  author: Tizzani, M.; Gauvin, L.
  journal: PLOS Computational Biology
  year: "2025"
  volume: "21"
  pages: e1013262
  url: https://doi.org/10.1371/journal.pcbi.1013262
  doi: 10.1371/journal.pcbi.1013262
  abstract: Socioeconomic inequalities significantly influence infectious disease outcomes, as seen with
    COVID-19, but the pathways through which socioeconomic conditions affect transmission dynamics remain
    unclear. To address this, we conducted a survey representative of the Italian population, stratified
    by age, gender, geographical area, city size, employment status, and education level. The survey’s
    final aim was to estimate differences in contact and protective behaviors across various population
    strata, both of which are crucial for understanding transmission dynamics. Our initial insights based
    on the survey indicate that years after the pandemic began, the perceived impact of COVID-19 on professional,
    economic, social, and psychological dimensions vary across socioeconomic strata, extending beyond
    the epidemiological outcomes. This reinforces the need for approaches that systematically consider
    socioeconomic determinants. In this context, using generalized linear models, we identified associations
    between socioeconomic factors and vaccination status for both COVID-19 and influenza, as well as the
    influence of socioeconomic conditions on mask-wearing and social distancing. Importantly, we also
    observed differences in contact behaviors based on employment status while education level did not
    show a significant association. These findings highlight the complex interplay of socioeconomic and
    demographic factors in shaping protective behavior and contact patterns. Understanding these dynamics
    can contribute to the improvement of epidemic models and better guide public health efforts for at-risk
    groups.
